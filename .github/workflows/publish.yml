# Publish `vetoworld` to PyPI via a Trusted Publisher.
name: publish

# **Tag-triggered, not push-triggered.** A release is a deliberate act; every
# commit to main is not one. Tags match the repo tag the manuscript cites.
on:
  push:
    tags: ["vetoworld-v*"]
  workflow_dispatch:

jobs:
  # **The suite gates the release.** Publishing a wheel whose tests were never
  # run puts a broken `vworld verify` in front of a replicator, which is the one
  # command this project asks strangers to trust.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # **Full history, not a shallow clone.** `emit corrections` verifies
          # every row against the commit it cites, and at depth 1 those commits
          # are simply absent — the artifact then reports its own ledger as
          # unverifiable, which is a fact about the checkout, not the ledger.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `worlds` loads the world BUILDER to enumerate authored levels, and that
      # imports textworld. The first version of this job installed neither and
      # the gate failed on a missing dependency rather than on the code.
      - run: pip install pytest pytest-timeout scipy textworld jericho
      # `test_raidex_pool` carries the `scored - joined == 6, and the same six
      # by name` invariant. `verify` alone would not catch that class: it
      # compares against the published literal, so a key defect that silently
      # dropped seven models from the join would pass the moment someone
      # updated the literal to match. The invariant is what noticed.
      #
      # `test_eden_banding` holds C5's rule, which is pinned rather than served
      # — nothing else would fail if the rule text moved.
      #
      # **The probe files are here because the release gate did not cover the
      # standing instrument.** `test_pin_invariance` walks the ROUNDS registry
      # and the probe is not a round; the wheel step below deliberately skips
      # `pin check`. So nothing between a commit and PyPI verified the probe
      # pin — on the one artifact the SCHEDULED JOB installs and then spends
      # money with, daily, unattended.
      #
      # That is the same shape as blockers 5 and 6: a rule with a path it never
      # reached. The release is a path. See AGENTS.md, "when a structural rule
      # lands, enumerate every path it must cover", and tests/test_serving_paths.
      - run: python -m pytest tests/test_vworld_packaging.py
                              tests/test_vworld_cli.py
                              tests/test_vworld_verify.py
                              tests/test_vworld_artifacts.py
                              tests/test_occasions.py
                              tests/test_raidex_pool.py
                              tests/test_eden_banding.py
                              tests/test_pin_invariance.py
                              tests/test_probe_pin.py
                              tests/test_probe_channel.py
                              tests/test_serving_paths.py
                              tests/test_exhibits.py
                              tests/test_layering.py -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # `worlds/` ships as package data — without it `vworld verify` cannot read
      # a single lock from an installed wheel. Checked here rather than
      # discovered by the first person to `pip install`.
      - name: the wheel must carry the worlds
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          locks = [n for n in names if n.endswith("BUILD.lock.json")]
          print(f"{whl}: {len(names)} files, {len(locks)} world locks")
          if len(locks) < 20:
              sys.exit(f"only {len(locks)} locks in the wheel; worlds/ did not ship")
          PY
      # **The wheel must RUN, on a machine that has nothing else installed.**
      #
      # `scipy` was an undeclared runtime dependency for three releases: every
      # CLI verb reaches `_shared/stats.py`, which imports `fisher_exact` at
      # module scope, so `pip install vetoworld` produced a `vworld` that died
      # on import — `vworld verify` included, the one command this project asks
      # strangers to trust.
      #
      # The test job above could not see it. It runs `pip install pytest scipy
      # textworld jericho` and then the suite, so the TEST ENVIRONMENT SUPPLIED
      # WHAT THE PACKAGE FAILED TO DECLARE. The only check that can catch this
      # class installs the artifact and nothing else.
      - name: the wheel must run with only its declared dependencies
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist/*.whl
          # `--help` is enough to catch the import class: `cli.main` imports
          # every command module, and `commands/occasion.py` is what reaches
          # `_shared/stats.py` and its scipy import. That is exactly where the
          # undeclared dependency died.
          /tmp/clean/bin/vworld --version
          /tmp/clean/bin/vworld --help > /dev/null
          /tmp/clean/bin/vworld corpus --help > /dev/null
          # NOT `pin check`: the C5 banding pin hashes its own specification,
          # `docs/vetoworld-c5-banding.md`, which is not package data — so that
          # verb cannot verify from an installed wheel. That is a real gap and
          # it is tracked, not papered over by dropping the check from the pin.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The whole point of a Trusted Publisher: GitHub mints a short-lived
      # OIDC token and PyPI verifies it. No API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
