[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seahaven"
version = "0.1.0"
license = "MIT"
description = "Harness for the Seahaven character-divergence experiment"
requires-python = ">=3.12"

# Dependencies are pinned in env/*.yml, not here. The dev and CUDA environments
# have incompatible transformers requirements and must never be resolved
# together; expressing them as extras would invite exactly that.
dependencies = []

[tool.setuptools.packages.find]
include = ["seahaven*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs a real model or a GPU; excluded from the default run",
]
timeout = 120
