[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# **The distribution is the public artifact, so it carries the public name.**
# It ships three import packages: `vetoworld` (the CLI and register), `seahaven`
# (the internal library, whose paths are hashed into every round pin and are
# therefore never renamed), and `worlds` (the compiled worlds, needed as package
# data or `vworld verify` cannot read a single lock).
name = "vetoworld"
version = "0.3.3"
license = "MIT"
description = "VetoWorld: a benchmark of expedience under terminal stakes"
# **Without this the PyPI page renders nothing at all.** 0.1.0 and 0.1.1 both
# shipped with a blank project description because no `readme` was declared;
# the file existed and was simply never referenced.
readme = "README.md"
requires-python = ">=3.12"
keywords = ["benchmark", "llm", "evaluation", "agents", "alignment",
            "textworld", "reproducibility"]
# No license classifier: `license = "MIT"` above is a PEP 639 expression, and
# setuptools now rejects the two together rather than letting them disagree.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Dependencies are pinned in env/*.yml, not here. The dev and CUDA environments
# have incompatible transformers requirements and must never be resolved
# together; expressing them as extras would invite exactly that.
#
# **`scipy` IS a runtime dependency and went undeclared for three releases.**
# `_shared/stats.py` imports `fisher_exact` at module scope, and every CLI verb
# reaches it through `commands/occasion.py`, so `pip install vetoworld` produced
# a `vworld` that died on `import` — including `vworld verify`, the one command
# this project asks strangers to trust.
#
# It survived because nothing ever tested the installed package on a clean
# machine. The CI gate runs `pip install pytest pytest-timeout scipy textworld
# jericho` and then the suite, so the TEST ENVIRONMENT SUPPLIED WHAT THE PACKAGE
# FAILED TO DECLARE — the same shape as the corpus fetch-back, where every check
# ran where the missing file happened to exist.
#
# Found by running the real install in a real HF Job before scheduling it.
dependencies = ["scipy>=1.10"]

# **The daily probe is the one verb that WRITES to HuggingFace**, and an
# authenticated upload cannot reuse `corpus fetch`'s hand-rolled unauthenticated
# urllib path. So it gets an extra rather than a runtime dependency: `vworld
# corpus fetch` — the verb a replicator runs first — still installs anywhere with
# nothing behind it, and only the scheduled job pulls the SDK.
#
# This does NOT reopen the decision above. That refuses extras for the dev and
# CUDA *environments*, which conflict with each other and must never resolve
# together. One leaf SDK, imported by exactly one module, is a different thing —
# and `test_ONLY_the_publish_module_may_import_the_HF_SDK` names which module.
#
# **`serve` exists because 0.3.0's scheduled job served ZERO cells.** Every one
# of its 22 cells failed with `No module named 'textworld'`, reported PARTIAL,
# exited 0 and pushed an empty day to the public log. `seahaven/fidelity/
# runner.py` reaches `seahaven/world/loader.py`, which imports `textworld.gym`
# — so EVERY serving path needs these, including `vworld replicate`, the verb
# this project asks strangers to run.
#
# They are an EXTRA and not a runtime dependency for the same reason
# `huggingface_hub` is: `vworld corpus fetch` and `vworld verify` must keep
# installing anywhere with nothing behind them, and jericho compiles. The cost
# of that choice is that a serving verb can be installed without what it needs,
# so the serving paths now REFUSE with an actionable message instead of raising
# ImportError once per cell — see `commands/_serving_deps.py`.
#
# This is the scipy defect of 0.2.1 one dependency over, and the check that
# caught scipy could not catch this: `vworld --help` imports the command modules
# but never opens a compiled world. Only serving does.
[project.optional-dependencies]
serve = ["textworld>=1.6", "jericho>=3.3"]
probe = ["huggingface_hub>=0.24", "vetoworld[serve]"]

[project.urls]
Homepage = "https://github.com/cloudronin/vetoworld"
Repository = "https://github.com/cloudronin/vetoworld"
Dataset = "https://huggingface.co/datasets/cloudronin/vetoworld-corpus"
Issues = "https://github.com/cloudronin/vetoworld/issues"

# seahaven-fidelity deliberately depends on nothing beyond the standard library
# at runtime: it talks to an OpenAI-compatible endpoint over urllib so it can be
# installed anywhere a model is being served, without dragging in a provider SDK.
[project.scripts]
vworld = "vetoworld.cli:main"
seahaven-fidelity = "seahaven.fidelity.cli:main"

[tool.setuptools.packages.find]
include = ["seahaven*", "vetoworld*", "worlds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs a real model or a GPU; excluded from the default run",
]
timeout = 120

[tool.setuptools.package-data]
# The pins hash these at repo-root-relative paths, so they must ship
# beside the code or `vworld verify` cannot read a single lock.
"worlds" = ["**/BUILD.lock.json", "**/*.json", "**/*.z8", "**/*.ni"]
# The assembled A1/A0 prompt bytes per world per generation. Data, not code, so
# it needs saying explicitly or the wheel ships a package that cannot check its
# own prompt assembly.
"vetoworld" = [
    "fixtures/*.json",
    # **The digest a fetched corpus is checked against.** Without it in the
    # wheel, `corpus fetch` on a fresh install has nothing to compare to and
    # says so — which means the check silently does not run for the one person
    # it exists for.
    "corpus.manifest.json",
]
