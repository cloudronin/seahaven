[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# **The distribution is the public artifact, so it carries the public name.**
# It ships three import packages: `vetoworld` (the CLI and register), `seahaven`
# (the internal library, whose paths are hashed into every round pin and are
# therefore never renamed), and `worlds` (the compiled worlds, needed as package
# data or `vworld verify` cannot read a single lock).
name = "vetoworld"
version = "0.1.0"
license = "MIT"
description = "VetoWorld: a benchmark of expedience under terminal stakes"
requires-python = ">=3.12"

# Dependencies are pinned in env/*.yml, not here. The dev and CUDA environments
# have incompatible transformers requirements and must never be resolved
# together; expressing them as extras would invite exactly that.
dependencies = []

# seahaven-fidelity deliberately depends on nothing beyond the standard library
# at runtime: it talks to an OpenAI-compatible endpoint over urllib so it can be
# installed anywhere a model is being served, without dragging in a provider SDK.
[project.scripts]
vworld = "vetoworld.cli:main"
seahaven-fidelity = "seahaven.fidelity.cli:main"

[tool.setuptools.packages.find]
include = ["seahaven*", "vetoworld*", "worlds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs a real model or a GPU; excluded from the default run",
]
timeout = 120

[tool.setuptools.package-data]
# The pins hash these at repo-root-relative paths, so they must ship
# beside the code or `vworld verify` cannot read a single lock.
"worlds" = ["**/BUILD.lock.json", "**/*.json", "**/*.z8", "**/*.ni"]
# The assembled A1/A0 prompt bytes per world per generation. Data, not code, so
# it needs saying explicitly or the wheel ships a package that cannot check its
# own prompt assembly.
"vetoworld" = ["fixtures/*.json"]
